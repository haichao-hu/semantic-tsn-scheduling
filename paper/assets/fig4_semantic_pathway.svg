<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" font-family="Times New Roman, serif" font-size="11">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#333"/></marker>
    <marker id="arrRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#e74c3c"/></marker>
    <marker id="arrBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3498db"/></marker>
  </defs>

  <text x="440" y="20" text-anchor="middle" font-weight="bold" font-size="13" fill="#2c3e50">Semantic Signaling Architecture: CUC → CNC → GCL Reconfiguration</text>

  <!-- Control Plane header -->
  <rect x="10" y="30" width="860" height="145" rx="8" fill="#e8f4f8" stroke="#4a90d9" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="25" y="52" font-weight="bold" font-size="11" fill="#2c5f8a">Control Plane (OAM VLAN, PCP=0, ms-scale)</text>

  <!-- Step indicators -->
  <text x="30" y="165" font-size="9" fill="#888">(Control plane: non-real-time signaling, physically/logically isolated from data plane TAS/CBS queues)</text>

  <!-- CUC -->
  <rect x="30" y="74" width="220" height="70" rx="6" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5"/>
  <text x="140" y="94" text-anchor="middle" font-weight="bold" fill="#e67e22" font-size="11">CUC</text>
  <text x="140" y="110" text-anchor="middle" font-size="9" fill="#555">User Configurator</text>
  <text x="140" y="125" text-anchor="middle" font-size="8" fill="#888">REST/gRPC/OPC-UA N-IF</text>
  <text x="140" y="138" text-anchor="middle" font-size="8" fill="#888">Semantic→FlowParams translation</text>

  <!-- CNC -->
  <rect x="315" y="74" width="230" height="70" rx="6" fill="#d4e6f1" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="430" y="94" text-anchor="middle" font-weight="bold" fill="#2c5f8a" font-size="11">CNC + CSRL + NC Shield</text>
  <text x="430" y="110" text-anchor="middle" font-size="9" fill="#555">Network Configurator</text>
  <text x="430" y="125" text-anchor="middle" font-size="8" fill="#888">CSRL GCL recomputation (inference)</text>
  <text x="430" y="138" text-anchor="middle" font-size="8" fill="#888">NC schedulability validation</text>

  <!-- Switch -->
  <rect x="610" y="74" width="250" height="70" rx="6" fill="#f0f0f0" stroke="#777" stroke-width="1.5"/>
  <text x="735" y="94" text-anchor="middle" font-weight="bold" fill="#555" font-size="11">TSN Switches (802.1Qbv/Qbu/Qav)</text>
  <text x="735" y="110" text-anchor="middle" font-size="9" fill="#555">NETCONF/YANG S-IF</text>
  <text x="735" y="125" text-anchor="middle" font-size="8" fill="#888">ASIC GCL reconfig (~2.67ms)</text>
  <text x="735" y="138" text-anchor="middle" font-size="8" fill="#888">Frame preemption (0.6μs) fallback</text>

  <!-- Control plane arrows -->
  <line x1="250" y1="109" x2="310" y2="109" stroke="#f39c12" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="280" y="104" text-anchor="middle" font-size="7" fill="#e67e22">Intent</text>

  <line x1="545" y1="109" x2="605" y2="109" stroke="#4a90d9" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="575" y="104" text-anchor="middle" font-size="7" fill="#2c5f8a">GCL</text>

  <!-- Data Plane section -->
  <rect x="10" y="190" width="860" height="120" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="25" y="212" font-weight="bold" font-size="11" fill="#1e8449">Data Plane (TSN deterministic forwarding, μs-scale)</text>

  <!-- LiDAR -->
  <rect x="30" y="230" width="160" height="55" rx="5" fill="#fadbd8" stroke="#e74c3c" stroke-width="1"/>
  <text x="110" y="250" text-anchor="middle" font-weight="bold" font-size="10" fill="#c0392b">LiDAR Sensor (Talker)</text>
  <text x="110" y="265" text-anchor="middle" font-size="8" fill="#555">L2 CBS (PCP=5)</text>
  <text x="110" y="278" text-anchor="middle" font-size="8" fill="#555">→ L1 TAS after upgrade (PCP=6)</text>

  <!-- Emergency Stop -->
  <rect x="220" y="230" width="160" height="55" rx="5" fill="#fadbd8" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="300" y="250" text-anchor="middle" font-weight="bold" font-size="10" fill="#c0392b">Emergency Stop (Talker)</text>
  <text x="300" y="265" text-anchor="middle" font-size="8" fill="#555">L0 TAS (PCP=7)</text>
  <text x="300" y="278" text-anchor="middle" font-size="8" fill="#555">Pre-allocated GCL [0,200μs]</text>

  <!-- Switch data plane -->
  <rect x="410" y="230" width="140" height="55" rx="5" fill="#fff" stroke="#27ae60" stroke-width="1"/>
  <text x="480" y="250" text-anchor="middle" font-weight="bold" font-size="10" fill="#1e8449">TSN Switch</text>
  <text x="480" y="265" text-anchor="middle" font-size="8" fill="#555">GCL gating (Q7-TAS,Q6-TAS,</text>
  <text x="480" y="278" text-anchor="middle" font-size="8" fill="#555">Q5-CBS,Q0-FIFO), gPTP sync</text>

  <!-- AGV -->
  <rect x="580" y="230" width="130" height="55" rx="5" fill="#d4efdf" stroke="#27ae60" stroke-width="1"/>
  <text x="645" y="250" text-anchor="middle" font-weight="bold" font-size="10" fill="#1e8449">AGV Controller</text>
  <text x="645" y="265" text-anchor="middle" font-size="8" fill="#555">Perception algo</text>
  <text x="645" y="278" text-anchor="middle" font-size="8" fill="#555">→ CUC semantic event</text>

  <!-- Actuator -->
  <rect x="740" y="230" width="120" height="55" rx="5" fill="#d4efdf" stroke="#27ae60" stroke-width="1"/>
  <text x="800" y="250" text-anchor="middle" font-weight="bold" font-size="10" fill="#1e8449">Brake Actuator</text>
  <text x="800" y="265" text-anchor="middle" font-size="8" fill="#555">(Listener)</text>
  <text x="800" y="278" text-anchor="middle" font-size="8" fill="#555">Pre-allocated L0 path</text>

  <!-- Data plane arrows -->
  <line x1="190" y1="257" x2="405" y2="257" stroke="#e74c3c" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arrRed)"/>
  <text x="300" y="295" text-anchor="middle" font-size="7" fill="#e74c3c">LiDAR frames (L2 CBS → L1 TAS after upgrade)</text>

  <line x1="380" y1="245" x2="405" y2="245" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#arrRed)"/>
  <text x="290" y="295" text-anchor="middle" font-size="7" fill="#e74c3c">-</text>

  <line x1="550" y1="257" x2="735" y2="257" stroke="#27ae60" stroke-width="1.2" marker-end="url(#arrBlue)"/>
  <text x="650" y="295" text-anchor="middle" font-size="7" fill="#27ae60">Processed data → brake command (L0, immediate)</text>

  <!-- Signal from AGV to CUC -->
  <line x1="645" y1="230" x2="140" y2="149" stroke="#f39c12" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrow)"/>
  <text x="300" y="328" text-anchor="middle" font-size="8" fill="#e67e22">CUC ← AGV: "LiDAR stream L2→L1" (ms-scale, non-real-time)</text>
</svg>